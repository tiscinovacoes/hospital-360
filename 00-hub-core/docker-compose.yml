name: hospital360-hub-core

services:
  hub-core:
    build:
      context: ../nucleo
      dockerfile: ../00-hub-core/Dockerfile
    container_name: 360-hub-core-app
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env.example
    environment:
      - NODE_ENV=production
      - PORT=3000
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.25'
          memory: 256M
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - hub-core-net

networks:
  hub-core-net:
    driver: bridge
