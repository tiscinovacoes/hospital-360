name: Hospital 360 - CI/CD Pipeline & Security Scan

on:
  push:
    branches: [ main, develop, dev, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-and-test:
    name: Build, Typecheck & Security Audit
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./nucleo

    steps:
      - name: Checkout Repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: ./nucleo/package-lock.json

      - name: Instalar Dependências
        run: npm ci

      - name: Checagem Estrita de Tipos (TypeScript)
        run: npx tsc --noEmit

      - name: Linting do Código
        run: npm run lint || true

      - name: Auditoria de Dependências (SAST)
        run: npm audit --audit-level=high || true

      - name: Verificação Estrita de Segredos & Credenciais (CRED-OMEGA)
        working-directory: ./
        run: |
          node seguranca/cred_omega_scanner.js

      - name: Executar Esteira de Homologação Assistencial
        working-directory: ./
        run: |
          echo "Simulando teste de esteira assistencial..."
          node integracoes/seguranca_rn_ind_auditoria.js

      - name: Executar Testes de Contrato das ACLs e CMED/BPS (Sprint 4)
        working-directory: ./
        run: |
          node tests/sprint4_acl_cmed_contracts.spec.js

      - name: Executar Testes de Contrato da Sprint 5 (FEFO, Split & Leitos)
        working-directory: ./
        run: |
          node tests/sprint5_fefo_split_leitos_contracts.spec.js

      - name: Executar Testes de Contrato da Sprint 6 (Observabilidade & A11Y WCAG 2.2)
        working-directory: ./
        run: |
          node tests/sprint6_observability_a11y_contracts.spec.js

      - name: Executar Testes E2E Door-to-Door & Smoke Test (Sprint 7)
        working-directory: ./
        run: |
          node tests/sprint7_e2e_doortodoor_smoke.spec.js
          node tests/patrimonio.spec.js

